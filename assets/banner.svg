<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="accent-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .pulse-circle {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .float-card {
        animation: float 6s ease-in-out infinite;
      }
      .dash-flow {
        stroke-dasharray: 8 8;
        animation: dash 20s linear infinite;
      }
      @keyframes pulse {
        0% { transform: scale(1) translate(0, 0); opacity: 0.3; }
        100% { transform: scale(1.15) translate(20px, -10px); opacity: 0.6; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
        100% { transform: translateY(0px); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -100; }
      }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#bg-gradient)" rx="16"/>

  <circle cx="150" cy="80" r="180" fill="url(#accent-glow)" class="pulse-circle" />
  <circle cx="1050" cy="240" r="220" fill="url(#accent-glow)" class="pulse-circle" style="animation-delay: -2s;" />

  <path d="M 50,260 Q 300,280 600,240 T 1150,270" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3" class="dash-flow" />
  <path d="M 50,280 Q 400,230 800,270 T 1150,240" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.25" class="dash-flow" style="animation-duration: 15s;" />

  <g class="float-card" opacity="0.4">
    <rect x="920" y="45" width="220" height="40" rx="20" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="1030" y="70" text-anchor="middle" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">🛒 POS Integration</text>
  </g>
  <g class="float-card" style="animation-delay: -3s;" opacity="0.4">
    <rect x="960" y="100" width="180" height="40" rx="20" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
    <text x="1050" y="125" text-anchor="middle" fill="#818cf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">⚡ Real-Time CDP</text>
  </g>

  <g transform="translate(70, 0)">
    <rect x="0" y="50" width="260" height="32" rx="16" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <text x="130" y="71" text-anchor="middle" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1">CURATED ECOSYSTEM 2026</text>

    <text x="0" y="130" fill="url(#text-gradient)" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#glow)">Awesome Retail Omnichannel CRM</text>

    <text x="0" y="172" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="400">Customer Data Unification • Headless Commerce • POS • AI Personalization</text>

    <g transform="translate(0, 215)">
      <rect x="0" y="0" width="165" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="82.5" y="21" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">🏬 SaaS &amp; Enterprise</text>

      <rect x="180" y="0" width="175" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="267.5" y="21" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">💻 Open-Source Repos</text>

      <rect x="370" y="0" width="165" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="452.5" y="21" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">📊 CDP &amp; Analytics</text>

      <rect x="550" y="0" width="150" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="625" y="21" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">🎯 Personalization</text>
    </g>
  </g>
</svg>
